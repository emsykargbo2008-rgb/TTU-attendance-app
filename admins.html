<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TTU Attendance">
    <title>Admin Management - TTU Smart Attendance System</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">T</div>
                    <span>TTU</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-page="dashboard">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="students.html" class="nav-item" data-page="students">
                    <span class="icon">👥</span>
                    <span>Students</span>
                </a>
                <a href="sessions.html" class="nav-item" data-page="sessions">
                    <span class="icon">📅</span>
                    <span>Sessions</span>
                </a>
                <a href="attendance.html" class="nav-item" data-page="attendance">
                    <span class="icon">✓</span>
                    <span>Mark Attendance</span>
                </a>
                <a href="reports.html" class="nav-item" data-page="reports">
                    <span class="icon">📈</span>
                    <span>Reports</span>
                </a>
                <a href="admins.html" class="nav-item active" data-page="admins">
                    <span class="icon">🔑</span>
                    <span>Admins</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn btn-secondary btn-full">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="topbar">
                <div class="topbar-left">
                    <h1>Admin Management</h1>
                </div>
                <div class="topbar-right">
                    <button id="addAdminBtn" class="btn btn-primary">➕ Add Admin</button>
                </div>
            </div>

            <!-- Content -->
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="Search admin...">
                            <span class="search-icon">🔍</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Created At</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="adminsTableBody">
                                    <tr>
                                        <td colspan="5" class="empty-state">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Admin Modal -->
    <div id="adminModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Admin</h2>
                <button class="close-btn">&times;</button>
            </div>
            <form id="adminForm" class="form">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" id="adminForm" data-admin-id="">
                </div>
                <div class="form-group">
                    <label for="adminRole">Role</label>
                    <select id="adminRole" required>
                        <option value="">Select Role</option>
                        <option value="main_admin">Main Admin</option>
                        <option value="assistant_admin">Assistant Admin</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Admin</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admins.js"></script>
    <script>
        window.addEventListener('load', () => {
            checkAuth();
            loadAdmins();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('addAdminBtn').addEventListener('click', openAddModal);
            document.getElementById('adminForm').addEventListener('submit', handleSaveAdmin);
            document.querySelector('.close-btn').addEventListener('click', closeModal);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        }

        async function loadAdmins() {
            try {
                const db = getFirestore();
                const snap = await getDocs(collection(db, 'users'));
                
                const tbody = document.getElementById('adminsTableBody');
                if (snap.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No admins found</td></tr>';
                } else {
                    tbody.innerHTML = snap.docs.map(doc => {
                        const data = doc.data();
                        const createdAt = new Date(data.createdAt).toLocaleDateString();
                        const roleColor = data.role === 'main_admin' ? 'badge-primary' : 'badge-success';
                        return `
                            <tr>
                                <td>${data.email}</td>
                                <td><span class="badge ${roleColor}">${data.role === 'main_admin' ? 'Main Admin' : 'Assistant Admin'}</span></td>
                                <td>${createdAt}</td>
                                <td><span class="badge badge-success">Active</span></td>
                                <td>
                                    <button class="btn-small" onclick="editAdmin('${doc.id}', '${data.email}', '${data.role}')">Edit</button>
                                    <button class="btn-small btn-danger" onclick="deleteAdmin('${doc.id}', '${data.email}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Error loading admins:', error);
                showToast('Error loading admins', 'error');
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Admin';
            document.getElementById('adminForm').reset();
            document.getElementById('adminForm').dataset.adminId = '';
            document.getElementById('adminPassword').required = true;
            document.getElementById('adminModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        async function editAdmin(adminId, email, role) {
            document.getElementById('modalTitle').textContent = 'Edit Admin';
            document.getElementById('adminEmail').value = email;
            document.getElementById('adminEmail').disabled = true;
            document.getElementById('adminPassword').required = false;
            document.getElementById('adminPassword').placeholder = 'Leave blank to keep current password';
            document.getElementById('adminRole').value = role;
            document.getElementById('adminForm').dataset.adminId = adminId;
            document.getElementById('adminModal').style.display = 'block';
        }

        async function deleteAdmin(adminId, email) {
            if (confirm(`Are you sure you want to delete ${email}?`)) {
                try {
                    const db = getFirestore();
                    
                    // Get user by email from Firestore
                    const snap = await getDocs(query(
                        collection(db, 'users'),
                        where('email', '==', email)
                    ));

                    if (!snap.empty) {
                        await deleteDoc(snap.docs[0].ref);
                        showToast('Admin deleted successfully', 'success');
                        loadAdmins();
                    }
                } catch (error) {
                    showToast('Error deleting admin: ' + error.message, 'error');
                }
            }
        }

        async function handleSaveAdmin(e) {
            e.preventDefault();
            const adminId = document.getElementById('adminForm').dataset.adminId;
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const role = document.getElementById('adminRole').value;

            try {
                const db = getFirestore();
                
                if (adminId) {
                    // Update existing admin
                    const snap = await getDocs(query(
                        collection(db, 'users'),
                        where('email', '==', email)
                    ));
                    
                    if (!snap.empty) {
                        await updateDoc(snap.docs[0].ref, {
                            role,
                            ...(password && { password })
                        });
                        showToast('Admin updated successfully', 'success');
                    }
                } else {
                    // Create new admin
                    const adminData = {
                        email,
                        password,
                        role,
                        createdAt: new Date().getTime(),
                        createdBy: JSON.parse(localStorage.getItem('user')).uid
                    };
                    await addDoc(collection(db, 'users'), adminData);
                    showToast('Admin created successfully', 'success');
                }
                
                closeModal();
                loadAdmins();
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#adminsTableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }

        async function handleLogout() {
            try {
                await logoutUser();
                window.location.href = 'login.html';
            } catch (error) {
                showToast('Logout failed: ' + error.message, 'error');
            }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type}`;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(() => console.log('Service worker registered.'))
                .catch(err => console.log('Service worker registration failed:', err));
        }

        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            window.deferredInstallPrompt = event;
        });
    </script>
</body>
</html>
